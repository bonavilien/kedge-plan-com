/* une fois par session, et jamais si l'appareil demande moins de mouvement ; l'appli appelle kpOuvrir() quand elle est prête */
(function () {
  var o = document.getElementById("ouverture"), r = document.documentElement;
  window.kpOuvrir = function () {};
  try { if (sessionStorage.getItem("kplan-ouvert") || matchMedia("(prefers-reduced-motion: reduce)").matches) { o.remove(); return; } } catch (e) {}
  r.classList.add("ouverture");
  var t0 = Date.now(), fait = false;
  window.kpOuvrir = function () {
    if (fait) return; fait = true;
    setTimeout(function () {
      r.classList.remove("ouverture"); o.classList.add("ouvre");
      try { sessionStorage.setItem("kplan-ouvert", "1"); } catch (e) {}
      setTimeout(function () { o.remove(); }, 950);
    }, Math.max(0, 1000 - (Date.now() - t0)));
  };
  setTimeout(window.kpOuvrir, 8000);
})();
</script>
